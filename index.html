<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A5B43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ملف شواهد الأداء الوظيفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout idea: deep-green summary panel on top, then a grid of numbered element tiles; each tile opens a full page for its evidence */
:root{
  --bg:#EFF4F1; --surface:#FFFFFF; --ink:#0C2620; --muted:#5B6F68; --line:#D8E3DD;
  --brand:#0A6B4D; --brand-deep:#07503A; --tint:#E2F2EA; --glow:#C6F25A; --glow-ink:#1C2B05;
  --danger:#C2362B; --on-brand:#FFFFFF;
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1412; --surface:#12201C; --ink:#E7F1EC; --muted:#93A9A1; --line:#23362F;
    --brand:#2BB486; --brand-deep:#0A4634; --tint:#16302A; --glow:#C6F25A; --glow-ink:#1C2B05;
    --danger:#F0685C; --on-brand:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1412; --surface:#12201C; --ink:#E7F1EC; --muted:#93A9A1; --line:#23362F;
  --brand:#2BB486; --brand-deep:#0A4634; --tint:#16302A; --glow:#C6F25A; --glow-ink:#1C2B05;
  --danger:#F0685C; --on-brand:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* summary panel */
.panel{background:var(--brand-deep);color:var(--on-brand);border-radius:0 0 28px 28px;padding:22px 0 20px;position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(60deg,rgba(255,255,255,.045) 0 2px,transparent 2px 26px),
  repeating-linear-gradient(-60deg,rgba(255,255,255,.045) 0 2px,transparent 2px 26px);pointer-events:none}
.panel .wrap{position:relative;display:flex;flex-direction:column;gap:18px}
.who{display:flex;gap:14px;align-items:center;justify-content:space-between}
.who-text{min-width:0}
.eyebrow{font-size:13px;color:var(--glow);font-weight:600;letter-spacing:.2px}
.who h1{font-family:var(--display);font-size:24px;line-height:1.35;margin:2px 0 2px;font-weight:800;text-wrap:balance}
.who p{margin:0;font-size:14px;opacity:.85}
.ring{flex:none;position:relative;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.ring small{position:absolute;bottom:-18px;inset-inline:0;text-align:center;font-size:11px;opacity:.8;white-space:nowrap}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.stat{flex:1 1 92px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;opacity:.85}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px}
.btn svg{width:20px;height:20px;flex:none}
.btn-glow{background:var(--glow);color:var(--glow-ink);flex:2 1 160px}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);flex:1 1 110px}
.btn-brand{background:var(--brand);color:#fff}
.btn-line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%}

.note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--tint);border:1px dashed var(--brand);border-radius:14px;padding:10px 14px;margin-top:16px;font-size:14px}
.note button{font-weight:700;color:var(--brand);text-decoration:underline;min-height:36px}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 12px}
.sec-h h2{font-family:var(--display);font-size:18px;margin:0;font-weight:700}
.sec-h span{font-size:13px;color:var(--muted)}

/* element tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:36px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:168px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile.has{border-color:var(--brand)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start}
.ico{width:44px;height:44px;border-radius:13px;background:var(--tint);color:var(--brand);display:grid;place-items:center}
.ico svg{width:24px;height:24px}
.tile.has .ico{background:var(--brand);color:#fff}
.num{font-family:var(--display);font-size:22px;font-weight:800;color:var(--line);font-variant-numeric:tabular-nums}
.tile.has .num{color:var(--brand)}
.tile h3{margin:0;font-size:15px;font-weight:600;line-height:1.5;flex:1}
.tile-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.pill{border-radius:99px;padding:3px 8px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--brand);color:#fff}
.pill.off{border:1.5px dashed var(--line);color:var(--muted)}
.wt{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.tile.add svg{width:28px;height:28px}

/* element page */
.bar{position:sticky;top:0;z-index:5;background:var(--brand-deep);color:#fff}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:60px}
.bar h2{font-family:var(--display);font-size:16px;margin:0;flex:1;line-height:1.5;padding:8px 0}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:inherit}
.icon-btn svg{width:22px;height:22px}
.bar .icon-btn{background:rgba(255,255,255,.1)}
.hints{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-top:16px}
.hints strong{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{background:var(--tint);color:var(--ink);border-radius:99px;padding:3px 11px;font-size:13px}
.shoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.shoot label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;border-radius:var(--r);font-weight:700;cursor:pointer;text-align:center;padding:10px}
.shoot label svg{width:30px;height:30px}
.shoot .cam{background:var(--brand);color:#fff}
.shoot .gal{background:var(--surface);border:1.5px solid var(--brand);color:var(--brand)}
.shoot input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.shoot label:focus-within{outline:3px solid var(--glow);outline-offset:2px}
.evs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
@media(min-width:640px){.evs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ev{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ev-img{display:block;aspect-ratio:3/4;background:var(--tint);width:100%}
.ev-img img{width:100%;height:100%;object-fit:cover;display:block}
.ev-cap{border:0;border-top:1.5px solid var(--line);background:transparent;padding:10px 12px 4px;width:100%;font-size:14px;font-weight:500;min-width:0}
.ev-cap::placeholder{color:var(--muted);font-weight:400}
.ev-meta{padding:0 12px 10px;font-size:12px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 16px;font-size:14.5px}
.foot-acts{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 40px}
.foot-acts .btn{flex:1 1 150px}

/* sheets, viewer, toast */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(4,18,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px 24px;display:flex;flex-direction:column;gap:14px}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px}}
.sheet h3{font-family:var(--display);font-size:18px;margin:0}
.sheet p{margin:0;color:var(--muted);font-size:14.5px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;min-height:48px;padding:0 14px;width:100%;font:inherit;color:inherit}
.field textarea{padding:10px 14px;min-height:150px;line-height:1.8;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{min-height:52px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;font-size:14px;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 130px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--brand)}
.viewer{position:fixed;inset:0;z-index:15;background:#06100D;color:#fff;display:flex;flex-direction:column}
.viewer-top{display:flex;justify-content:space-between;padding:10px 12px}
.viewer-top .icon-btn{background:rgba(255,255,255,.12)}
.viewer-img{flex:1;min-height:0;display:grid;place-items:center;padding:0 8px}
.viewer-img img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-cap{padding:12px 16px 20px;text-align:center;font-size:15px}
.toast{position:fixed;bottom:22px;inset-inline:16px;z-index:40;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;text-align:center;font-size:14.5px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* print */
#printRoot{display:none}
@page{size:A4;margin:10mm}
@media print{
  html,body{background:#fff!important}
  #app,.overlay,.viewer,.toast{display:none!important}
  #printRoot{display:block;color:#111;font-family:var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp{height:275mm;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:5mm;break-after:page;page-break-after:always;overflow:hidden}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .pp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;border-bottom:1mm solid #0A6B4D;padding-bottom:3mm}
  .pp-head b{font-family:var(--display);font-size:15pt;color:#07503A;line-height:1.4}
  .pp-head span{font-size:10pt;color:#444;white-space:nowrap}
  .pp-foot{display:flex;justify-content:space-between;font-size:9pt;color:#555;border-top:.3mm solid #cfd8d3;padding-top:2mm}
  .pp-grid{display:grid;gap:5mm;min-height:0}
  .g1{grid-template:minmax(0,1fr) / 1fr}
  .g2{grid-template:repeat(2,minmax(0,1fr)) / 1fr}
  .g4{grid-template:repeat(2,minmax(0,1fr)) / repeat(2,minmax(0,1fr))}
  .pp figure{margin:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:2mm;min-height:0;min-width:0;border:.3mm solid #cfd8d3;border-radius:3mm;padding:3mm;overflow:hidden}
  .pp figure img{width:100%;height:100%;object-fit:contain;min-height:0;display:block}
  .pp figcaption{font-size:11pt;font-weight:600;text-align:center;line-height:1.5}
  .pp figcaption small{display:block;font-weight:400;color:#555;font-size:9pt}
  .cover{grid-template-rows:auto auto minmax(0,1fr) auto}
  .cv-top{display:flex;justify-content:space-between;font-size:11pt;line-height:1.9;border-bottom:1mm solid #0A6B4D;padding-bottom:4mm}
  .cv-title{text-align:center;padding:10mm 0 4mm}
  .cv-title h1{font-family:var(--display);font-size:28pt;color:#07503A;margin:0 0 3mm}
  .cv-title p{margin:0;font-size:14pt}
  .cv-title .nm{font-family:var(--display);font-size:18pt;font-weight:700;margin-top:6mm}
  .cv-mid{min-height:0}
  .cv-table{width:100%;border-collapse:collapse;font-size:11pt}
  .cv-table th,.cv-table td{border:.3mm solid #b9c7c0;padding:2.2mm 3mm;text-align:start}
  .cv-table th{background:#0A6B4D;color:#fff;font-weight:600}
  .cv-table td.c{text-align:center;font-variant-numeric:tabular-nums;width:22mm}
  .pp-body{min-height:0;font-size:13pt}
  .intro p{margin:0 0 6mm;line-height:2.2;text-align:justify}
  .info{width:100%;border-collapse:collapse;font-size:13pt}
  .info th,.info td{border:.3mm solid #b9c7c0;padding:4mm;text-align:start}
  .info th{background:#E2F2EA;width:50mm;font-weight:600;color:#07503A}
  .pp-foot span:nth-child(2){font-weight:700;color:#07503A}
  .cover2{grid-template-rows:auto minmax(0,1fr) auto;border:1.2mm solid #0A6B4D;border-radius:6mm;padding:9mm}
  .cover2 .cv-top{font-weight:600}
  .cv-mid2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10mm;text-align:center;min-height:0}
  .cv-band{background:#0A6B4D;color:#fff;border-radius:6mm;padding:12mm 8mm;width:100%}
  .cv-band h1{font-family:var(--display);font-size:30pt;margin:0;line-height:1.5}
  .cv-band p{margin:2mm 0 0;font-size:15pt}
  .cv-lbl{font-size:12pt;color:#555}
  .cv-name{font-family:var(--display);font-size:22pt;font-weight:700;color:#07503A;line-height:1.8}
  .cv-sub{font-size:13pt}
  .cv-bot{display:flex;justify-content:space-between;font-size:11pt;border-top:.4mm solid #0A6B4D;padding-top:3mm}
  .qr{width:32mm;height:32mm;image-rendering:pixelated}
  .qr-box{display:flex;flex-direction:column;align-items:center;gap:2mm;font-size:9.5pt;color:#444}
  .div-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7mm;text-align:center;min-height:0;border:1mm solid #0A6B4D;border-radius:6mm;padding:10mm}
  .div-num{font-family:var(--display);font-size:80pt;font-weight:800;color:#0A6B4D;line-height:1}
  .div-mid h2{font-family:var(--display);font-size:26pt;margin:0;line-height:1.6;color:#07503A}
  .div-chips{display:flex;gap:4mm;font-size:13pt}
  .div-chips span{background:#E2F2EA;border-radius:99mm;padding:1.5mm 6mm}
  .cv-sign{display:flex;justify-content:space-between;font-size:11pt;padding:0 6mm 4mm}
  .cv-sign div{text-align:center;line-height:2.4}
}
</style>
</head>

</div>

<div id="printRoot"></div>

/* ---------- storage ---------- */
let db=null,evs=[];const urls=new Map();
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open("shawahid",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("ev",{keyPath:"id"});
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function tx(mode,fn){return new Promise((res,rej)=>{const t=db.transaction("ev",mode);const q=fn(t.objectStore("ev"));
  t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function dbPut(o){if(!db)return true;try{await tx("readwrite",s=>s.put(o));return true}catch(e){toast("تعذر الحفظ، مساحة الجهاز ممتلئة");return false}}
async function dbDel(id){if(!db)return;try{await tx("readwrite",s=>s.delete(id))}catch(e){}}
function urlOf(e){if(!urls.has(e.id))urls.set(e.id,URL.createObjectURL(e.blob));return urls.get(e.id)}
function dropUrl(id){if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}}
const ofEl=id=>evs.filter(e=>e.el===id).sort((a,b)=>a.ts-b.ts);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- navigation (phone back button closes the top layer) ---------- */
const stack=[];let hist=true;
function push(closeFn){stack.push(closeFn);if(hist){try{history.pushState({d:stack.length},"")}catch(e){hist=false}}}
function back(n){n=n||1;if(hist&&history.state&&history.state.d){history.go(-n)}else{while(n-->0&&stack.length)stack.pop()()}}
window.addEventListener("popstate",e=>{const d=(e.state&&e.state.d)||0;while(stack.length>d)stack.pop()()});

/* ---------- helpers ---------- */
let toastT;
function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function hijri(ts){try{return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"}).format(new Date(ts))}catch(e){return new Date(ts).toLocaleDateString()}}
function compress(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const M=1800;let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",.82)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};im.src=u})}
function demoBlob(title,color){return new Promise(r=>{const c=document.createElement("canvas");c.width=900;c.height=1200;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,900,1200);x.fillStyle=color;x.fillRect(0,0,900,150);x.fillStyle="#fff";x.font="bold 44px sans-serif";x.textAlign="center";
  try{x.direction="rtl"}catch(e){}x.fillText(title,450,95);x.fillStyle="#e1e8e4";for(let i=0;i<9;i++)x.fillRect(90+(i%3)*120,240+i*78,720-(i%3)*120,26);
  x.translate(450,1030);x.rotate(-.1);x.strokeStyle="#c2362b";x.lineWidth=6;x.strokeRect(-240,-62,480,124);x.fillStyle="#c2362b";x.font="bold 54px sans-serif";x.fillText("نموذج تجريبي",0,19);
  c.toBlob(r,"image/jpeg",.85)})}

    s.querySelector("#p-per").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.per=+b.dataset.v;saveS();s.querySelectorAll("#p-per button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
    s.querySelector("#p-x").onclick=()=>back();
    s.querySelector("#p-go").onclick=async()=>{const cv=s.querySelector("#p-cover");if(cv){S.cover=cv.checked;saveS()}
      const n=buildPrint(scope==="one"?elId:null);if(!n){toast("لا توجد شواهد للطباعة");return}
      await Promise.all([...document.querySelectorAll("#printRoot img")].map(i=>i.decode?i.decode().catch(()=>{}):0));
      try{window.print()}catch(e){toast("الطباعة غير متاحة في هذا العرض")}}})}
function buildPrint(onlyId){
  const els=allEls();const per=S.per||2;const full=onlyId==null&&S.cover;
  const targets=(onlyId!=null?els.filter(e=>e.id===onlyId):els).filter(e=>ofEl(e.id).length);
  if(!targets.length){$("#printRoot").innerHTML="";return 0}
  let pn=full?5:1;const start={};
  for(const e of targets){start[e.id]=pn;pn+=(full?1:0)+Math.ceil(ofEl(e.id).length/per)}
  const foot=n=>`<div class="pp-foot"><span>${esc(S.school)}</span><span>${n}</span><span>العام الدراسي ${esc(S.year)}</span></div>`;
  const head=t=>`<div class="pp-head"><b>${t}</b><span>${esc(S.name)}</span></div>`;
  let pages="",count=0,n=1;
  if(full){
    const qr=qrImg(S.link);
    pages+=`<section class="pp cover2">
     <div class="cv-top"><div>المملكة العربية السعودية<br>وزارة التعليم<br>${esc(S.admin)}<br>${esc(S.school)}</div><div style="text-align:end">العام الدراسي<br>${esc(S.year)}</div></div>
     <div class="cv-mid2"><div class="cv-band"><h1>ملف شواهد الأداء الوظيفي</h1><p>للعام الدراسي ${esc(S.year)}</p></div>
       <div><div class="cv-lbl">إعداد المعلم</div><div class="cv-name">${esc(S.name)}</div><div class="cv-sub">${esc(S.subject)}</div></div>
       ${qr?`<div class="qr-box">${qr}<span>امسح الباركود لفتح النسخة الإلكترونية</span></div>`:""}</div>
     <div class="cv-bot"><span>مدير المدرسة: ${esc(S.principal||"....................")}</span><span>${esc(hijri(Date.now()))}</span></div>
    </section>`;
    const row=(k,v)=>`<tr><th>${k}</th><td>${esc(v||"")}</td></tr>`;
    pages+=`<section class="pp">${head("بيانات المعلم")}<div class="pp-body"><table class="info"><tbody>
      ${row("اسم المعلم",S.name)}${row("المادة والصف",S.subject)}${row("المدرسة",S.school)}${row("إدارة التعليم",S.admin)}${row("مدير المدرسة",S.principal)}${row("العام الدراسي",S.year)}
      ${row("عدد عناصر الأداء",els.length)}${row("إجمالي الشواهد",evs.length)}${row("تاريخ إعداد الملف",hijri(Date.now()))}
      </tbody></table></div>${foot(2)}</section>`;
    pages+=`<section class="pp">${head("المقدمة")}<div class="pp-body intro">${esc(introText()).split(/\n+/).map(x=>`<p>${x}</p>`).join("")}</div>${foot(3)}</section>`;
    pages+=`<section class="pp">${head("الفهرس")}<div class="pp-body"><table class="cv-table"><thead><tr><th style="width:12mm">م</th><th>عنصر الأداء</th><th>الوزن</th><th>عدد الشواهد</th><th>الصفحة</th></tr></thead><tbody>
      ${els.map((e,k)=>`<tr><td class="c">${k+1}</td><td>${esc(e.t)}</td><td class="c">${e.w?e.w+"%":"-"}</td><td class="c">${ofEl(e.id).length}</td><td class="c">${start[e.id]||"-"}</td></tr>`).join("")}
      <tr><td class="c"></td><td>الخاتمة والاعتماد</td><td class="c"></td><td class="c"></td><td class="c">${pn}</td></tr>
      </tbody></table></div>${foot(4)}</section>`;
    n=5;
  }
  for(const e of targets){const list=ofEl(e.id);const idx=els.findIndex(x=>x.id===e.id)+1;const np=Math.ceil(list.length/per);
    if(full){const qr=qrImg(S.links[e.id]);
      pages+=`<section class="pp divp"><div></div><div class="div-mid"><div class="div-num">${pad(idx)}</div><h2>${esc(e.t)}</h2>
        <div class="div-chips">${e.w?`<span>الوزن ${e.w}%</span>`:""}<span>${plural(list.length)}</span></div>
        ${qr?`<div class="qr-box">${qr}<span>امسح الباركود لفتح شواهد هذا العنصر</span></div>`:""}</div>${foot(n++)}</section>`}
    for(let p=0;p<np;p++){const chunk=list.slice(p*per,p*per+per);count+=chunk.length;
      pages+=`<section class="pp">${head(idx+". "+esc(e.t))}
       <div class="pp-grid g${per}">${chunk.map(v=>`<figure><img src="${urlOf(v)}" alt=""><figcaption>${esc(v.cap||"شاهد")}<small>${esc(hijri(v.ts))}</small></figcaption></figure>`).join("")}</div>${foot(n++)}</section>`}}
  if(full){
    pages+=`<section class="pp">${head("الخاتمة والاعتماد")}<div class="pp-body intro"><p>تم بحمد الله إعداد ملف شواهد الأداء الوظيفي للعام الدراسي ${esc(S.year)}، ويضم ${evs.length} من الشواهد موزعة على ${targets.length} من عناصر الأداء.</p><p>أقر بأن جميع الشواهد الواردة في هذا الملف صحيحة وتمثل أعمالا نفذتها خلال العام الدراسي.</p>
      <div class="cv-sign" style="margin-top:25mm"><div>المعلم<br>${esc(S.name)}<br>التوقيع: ....................</div><div>مدير المدرسة<br>${esc(S.principal||"....................")}<br>التوقيع: ....................<br>الختم</div></div></div>${foot(n)}</section>`;
  }
  $("#printRoot").innerHTML=pages;return count;
}

/* ---------- backup ---------- */
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function d2b(d){const p=d.split(",");const bin=atob(p[1]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:"image/jpeg"})}
function backupSheet(){
  openSheet(`<h3>النسخة الاحتياطية</h3><p>الشواهد محفوظة على هذا الجوال فقط ولا تُرفع لأي مكان. احفظ نسخة كل فترة حتى لا تضيع إذا تغيّر الجوال أو مُسحت بيانات المتصفح.</p>
   ${framed?`<p>حفظ النسخة يعمل عند فتح التطبيق من متصفح الجوال مباشرة.</p>`:""}
   <button class="btn btn-brand btn-block" id="b-out">${svg(IC.save)}حفظ نسخة احتياطية</button>
   <label class="btn btn-line btn-block" for="b-in" style="cursor:pointer">استرجاع من نسخة محفوظة</label><input id="b-in" type="file" accept="application/json,.json" hidden>
   <button class="btn btn-line btn-block" id="b-x">إغلاق</button>`,s=>{
    s.querySelector("#b-x").onclick=()=>back();
    s.querySelector("#b-out").onclick=async()=>{const real=evs.filter(e=>!e.demo);const out={app:"shawahid",v:1,s:S,evs:[]};
      for(const e of real)out.evs.push({id:e.id,el:e.el,cap:e.cap,ts:e.ts,data:await b2d(e.blob)});
      try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:"application/json"}));a.download="shawahid-backup.json";document.body.appendChild(a);a.click();a.remove();toast("تم تجهيز النسخة ("+real.length+")")}catch(e){toast("تعذر حفظ النسخة في هذا العرض")}};
    s.querySelector("#b-in").onchange=async e=>{const f=e.target.files[0];if(!f)return;
      try{const o=JSON.parse(await f.text());if(o.app!=="shawahid"||!Array.isArray(o.evs))throw 0;let n=0;
        for(const x of o.evs){if(evs.some(v=>v.id===x.id))continue;const v={id:x.id,el:x.el,cap:x.cap||"",ts:x.ts,blob:d2b(x.data)};if(await dbPut(v)){evs.push(v);n++}}
        if(o.s){S=Object.assign({},DEF,o.s,{seeded:true});saveS()}back();renderHome();toast("تم استرجاع "+n+" من الشواهد")}
      catch(_){toast("الملف غير صالح. اختر ملف النسخة الاحتياطية الصحيح")}}})}

/* ---------- start ---------- */
(async function(){
  renderHome();
  db=await idbOpen();
  if(db){try{evs=await tx("readonly",s=>s.getAll())||[]}catch(e){db=null}}
  if(!S.seeded&&!evs.length){
    const d=[[1,"سجل الإشراف اليومي","#0A6B4D"],[4,"تقرير استراتيجية التعلم باللعب","#0E7C86"],[7,"درس تفاعلي على منصة مدرستي","#5B4BB7"]];
    for(let k=0;k<d.length;k++){const v={id:"demo"+k,el:d[k][0],cap:d[k][1],ts:Date.now()+k,blob:await demoBlob(d[k][1],d[k][2]),demo:true};await dbPut(v);evs.push(v)}
    S.seeded=true;saveS();
  }
  renderHome();
})();
</script>
