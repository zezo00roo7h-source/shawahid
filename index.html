<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07503A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ملف شواهد الأداء الوظيفي</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="شواهدي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout idea: deep-green summary panel on top, then a grid of numbered element tiles; each tile opens a full page for its evidence */
:root{
  --bg:#EFF4F1; --surface:#FFFFFF; --ink:#0C2620; --muted:#5B6F68; --line:#D8E3DD;
  --brand:#0A6B4D; --brand-deep:#07503A; --tint:#E2F2EA; --glow:#C6F25A; --glow-ink:#1C2B05;
  --danger:#C2362B; --on-brand:#FFFFFF;
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1412; --surface:#12201C; --ink:#E7F1EC; --muted:#93A9A1; --line:#23362F;
    --brand:#2BB486; --brand-deep:#0A4634; --tint:#16302A; --glow:#C6F25A; --glow-ink:#1C2B05;
    --danger:#F0685C; --on-brand:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1412; --surface:#12201C; --ink:#E7F1EC; --muted:#93A9A1; --line:#23362F;
  --brand:#2BB486; --brand-deep:#0A4634; --tint:#16302A; --glow:#C6F25A; --glow-ink:#1C2B05;
  --danger:#F0685C; --on-brand:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* summary panel */
.panel{background:var(--brand-deep);color:var(--on-brand);border-radius:0 0 28px 28px;padding:22px 0 20px;position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(60deg,rgba(255,255,255,.045) 0 2px,transparent 2px 26px),
  repeating-linear-gradient(-60deg,rgba(255,255,255,.045) 0 2px,transparent 2px 26px);pointer-events:none}
.panel .wrap{position:relative;display:flex;flex-direction:column;gap:18px}
.who{display:flex;gap:14px;align-items:center;justify-content:space-between}
.who-text{min-width:0}
.eyebrow{font-size:13px;color:var(--glow);font-weight:600;letter-spacing:.2px}
.who h1{font-family:var(--display);font-size:24px;line-height:1.35;margin:2px 0 2px;font-weight:800;text-wrap:balance}
.who p{margin:0;font-size:14px;opacity:.85}
.ring{flex:none;position:relative;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.ring small{position:absolute;bottom:-18px;inset-inline:0;text-align:center;font-size:11px;opacity:.8;white-space:nowrap}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.stat{flex:1 1 92px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;opacity:.85}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px}
.btn svg{width:20px;height:20px;flex:none}
.btn-glow{background:var(--glow);color:var(--glow-ink);flex:2 1 160px}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);flex:1 1 110px}
.btn-brand{background:var(--brand);color:#fff}
.btn-line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%}

.note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--tint);border:1px dashed var(--brand);border-radius:14px;padding:10px 14px;margin-top:16px;font-size:14px}
.note button{font-weight:700;color:var(--brand);text-decoration:underline;min-height:36px}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 12px}
.sec-h h2{font-family:var(--display);font-size:18px;margin:0;font-weight:700}
.sec-h span{font-size:13px;color:var(--muted)}

/* element tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:36px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:168px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile.has{border-color:var(--brand)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start}
.ico{width:44px;height:44px;border-radius:13px;background:var(--tint);color:var(--brand);display:grid;place-items:center}
.ico svg{width:24px;height:24px}
.tile.has .ico{background:var(--brand);color:#fff}
.num{font-family:var(--display);font-size:22px;font-weight:800;color:var(--line);font-variant-numeric:tabular-nums}
.tile.has .num{color:var(--brand)}
.tile h3{margin:0;font-size:15px;font-weight:600;line-height:1.5;flex:1}
.tile-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.pill{border-radius:99px;padding:3px 8px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--brand);color:#fff}
.pill.off{border:1.5px dashed var(--line);color:var(--muted)}
.wt{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.tile.add svg{width:28px;height:28px}
.ver{text-align:center;color:var(--muted);font-size:12.5px;margin:-18px 0 28px}

/* element page */
.bar{position:sticky;top:0;z-index:5;background:var(--brand-deep);color:#fff}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:60px}
.bar h2{font-family:var(--display);font-size:16px;margin:0;flex:1;line-height:1.5;padding:8px 0}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:inherit}
.icon-btn svg{width:22px;height:22px}
.bar .icon-btn{background:rgba(255,255,255,.1)}
.hints{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-top:16px}
.hints strong{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{background:var(--tint);color:var(--ink);border-radius:99px;padding:3px 11px;font-size:13px}
.shoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.shoot label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;border-radius:var(--r);font-weight:700;cursor:pointer;text-align:center;padding:10px}
.shoot label svg{width:30px;height:30px}
.shoot .cam{background:var(--brand);color:#fff}
.shoot .gal{background:var(--surface);border:1.5px solid var(--brand);color:var(--brand)}
.shoot input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.shoot label:focus-within{outline:3px solid var(--glow);outline-offset:2px}
.evs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
@media(min-width:640px){.evs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ev{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ev-img{display:block;aspect-ratio:3/4;background:var(--tint);width:100%}
.ev-img img{width:100%;height:100%;object-fit:cover;display:block}
.ev-cap{border:0;border-top:1.5px solid var(--line);background:transparent;padding:10px 12px 4px;width:100%;font-size:14px;font-weight:500;min-width:0}
.ev-cap::placeholder{color:var(--muted);font-weight:400}
.ev-meta{padding:0 12px 10px;font-size:12px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 16px;font-size:14.5px}
.foot-acts{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 40px}
.foot-acts .btn{flex:1 1 150px}

/* sheets, viewer, toast */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(4,18,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px 24px;display:flex;flex-direction:column;gap:14px}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px}}
.sheet h3{font-family:var(--display);font-size:18px;margin:0}
.sheet p{margin:0;color:var(--muted);font-size:14.5px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;min-height:48px;padding:0 14px;width:100%;font:inherit;color:inherit}
.field textarea{padding:10px 14px;min-height:150px;line-height:1.8;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{min-height:52px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;font-size:14px;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 130px}
.logos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logo-slot{border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.logo-slot img{height:56px;max-width:100%;object-fit:contain;background:#fff;border-radius:8px;padding:4px}
.logo-slot label,.logo-slot button{color:var(--brand);font-weight:700;min-height:36px;display:grid;place-items:center;cursor:pointer}
.check{display:flex;align-items:center;gap:10px;font-weight:500;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--brand)}
.viewer{position:fixed;inset:0;z-index:15;background:#06100D;color:#fff;display:flex;flex-direction:column}
.viewer-top{display:flex;justify-content:space-between;padding:10px 12px}
.viewer-top .icon-btn{background:rgba(255,255,255,.12)}
.viewer-img{flex:1;min-height:0;display:grid;place-items:center;padding:0 8px}
.viewer-img img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-cap{padding:12px 16px 20px;text-align:center;font-size:15px}
.toast{position:fixed;bottom:22px;inset-inline:16px;z-index:40;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;text-align:center;font-size:14.5px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* print: full-bleed A4 pages; deep green cover and section openers, white content pages with a green header band */
#printRoot{display:none}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important;margin:0}
  #app,.overlay,.viewer,.toast{display:none!important}
  #printRoot{display:block;color:#10261F;font-family:var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp{position:relative;width:210mm;height:296.6mm;overflow:hidden;break-after:page;page-break-after:always;background:#fff;display:flex;flex-direction:column}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .lat{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ring{position:absolute;border-radius:50%;width:auto;height:auto}
  /* header band + footer of inner pages */
  .ph{position:relative;background:#07503A;color:#fff;border-bottom:2.2mm solid #C6F25A;overflow:hidden;flex:none}
  .ph-in{position:relative;display:flex;align-items:center;gap:5mm;padding:10mm 16mm 7mm}
  .tag{flex:none;background:#C6F25A;color:#1C2B05;font-family:var(--display);font-weight:800;font-size:15pt;border-radius:3.5mm;min-width:13mm;height:13mm;display:grid;place-items:center;padding:0 3mm}
  .ph h2{font-family:var(--display);font-size:17pt;font-weight:700;margin:0;line-height:1.5;flex:1}
  .ph .who{flex:none;font-size:9pt;line-height:1.75;text-align:end;color:#D9E8E1}
  .pb{flex:1;min-height:0;overflow:hidden;padding:9mm 16mm 5mm;display:flex;flex-direction:column;gap:6mm}
  .pf{flex:none;margin:0 16mm;padding:3mm 0 8mm;border-top:.35mm solid #CFE0D7;display:flex;align-items:center;justify-content:space-between;font-size:9pt;color:#5B6F68}
  .pf b{width:9mm;height:9mm;border-radius:50%;background:#07503A;color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:10pt}
  /* evidence */
  .pg{display:grid;gap:6mm;align-content:start}
  .g1,.g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fg{position:relative;margin:0;border:.45mm solid #CFE0D7;border-radius:4.5mm;overflow:hidden;background:#fff;min-width:0}
  .fg img{display:block;width:100%;height:92mm;object-fit:contain;background:#F3F8F5}
  .g1 .fg img{height:202mm}
  .fg .no{position:absolute;top:0;inset-inline-start:0;background:#07503A;color:#fff;font-size:9pt;font-weight:700;padding:1.2mm 4mm;border-end-end-radius:3.5mm}
  .fg figcaption{display:flex;justify-content:space-between;align-items:center;gap:4mm;background:#E8F4EE;border-top:.45mm solid #CFE0D7;padding:2.6mm 4.5mm;font-size:10.5pt;font-weight:600;line-height:1.5}
  .fg figcaption small{flex:none;font-weight:500;font-size:8.5pt;color:#5B6F68;white-space:nowrap}
  /* cover */
  .cv{background:#07503A;color:#fff}
  .cv-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:15mm 16mm 0;font-size:11.5pt;font-weight:600;line-height:1.9}
  .cv-org{display:flex;align-items:flex-start;gap:5mm}
  .lg{flex:none;background:#fff;border-radius:4mm;padding:2.5mm;display:grid;place-items:center}
  .lg img{display:block;height:21mm;max-width:42mm;object-fit:contain}
  .cv-year{background:#C6F25A;color:#1C2B05;font-family:var(--display);font-weight:800;font-size:12pt;border-radius:99mm;padding:1.5mm 6mm;line-height:1.6}
  .cv-main{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 16mm}
  .cv-eye{color:#C6F25A;font-weight:600;font-size:13pt;letter-spacing:.3mm}
  .cv-main h1{font-family:var(--display);font-weight:800;font-size:50pt;line-height:1.35;margin:3mm 0 0}
  .cv-main h1 span{display:block;color:#C6F25A}
  .cv-bar{width:34mm;height:2.6mm;border-radius:2mm;background:#C6F25A;margin:7mm 0 6mm}
  .cv-main p{margin:0;font-size:13pt;line-height:1.9;max-width:104mm;color:#E4EEEA}
  .cv-card{position:relative;margin:0 16mm 10mm;background:#fff;color:#10261F;border-radius:6mm;padding:8mm 9mm;display:flex;align-items:center;gap:8mm}
  .cv-card .info{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5mm 8mm}
  .cv-card .full{grid-column:1/-1;border-bottom:.35mm solid #CFE0D7;padding-bottom:4mm}
  .lb{font-size:9pt;color:#5B6F68;font-weight:600}
  .cv-name{font-family:var(--display);font-weight:800;font-size:22pt;color:#07503A;line-height:1.6}
  .vl{font-size:12pt;font-weight:600;line-height:1.6}
  .cv-foot{position:relative;text-align:center;font-size:9.5pt;color:#B9D0C7;padding-bottom:9mm}
  .qr{width:30mm;height:30mm;image-rendering:pixelated;display:block}
  .qr-box{flex:none;display:flex;flex-direction:column;align-items:center;gap:1.5mm;font-size:8pt;color:#5B6F68;text-align:center;max-width:34mm}
  /* data page */
  .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}
  .st{background:#07503A;color:#fff;border-radius:5mm;padding:6mm 6mm 5mm}
  .st b{display:block;font-family:var(--display);font-weight:800;font-size:30pt;color:#C6F25A;line-height:1.1}
  .st span{font-size:10.5pt}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
  .dc{border:.45mm solid #CFE0D7;border-inline-start:2.2mm solid #0A6B4D;border-radius:4mm;padding:4.5mm 6mm}
  .dc.w{grid-column:1/-1}
  .dc .vl{font-size:14pt;margin-top:1mm}
  .sec{font-family:var(--display);font-weight:700;font-size:13pt;color:#07503A;display:flex;align-items:center;gap:3mm;margin:0}
  .sec::before{content:"";width:8mm;height:2.2mm;border-radius:2mm;background:#C6F25A}
  /* intro + closing text */
  .bsm{text-align:center;font-family:var(--display);font-weight:700;font-size:17pt;color:#07503A;display:flex;align-items:center;justify-content:center;gap:5mm}
  .bsm::before,.bsm::after{content:"";width:22mm;height:.6mm;background:#C6F25A}
  .txt{background:#F3F8F5;border-radius:5mm;border-inline-start:2.6mm solid #C6F25A;padding:9mm 10mm 4mm}
  .txt p{margin:0 0 6mm;font-size:13.5pt;line-height:2.25;text-align:justify}
  .by{align-self:flex-end;text-align:center;font-size:11pt;line-height:1.9;color:#5B6F68}
  .by b{display:block;font-family:var(--display);font-size:14pt;color:#07503A}
  /* index */
  .ix-h,.ix-r{display:flex;align-items:center;gap:4mm}
  .ix-h{font-size:9pt;color:#5B6F68;font-weight:600;padding-bottom:2mm;border-bottom:.6mm solid #07503A}
  .ix-r{padding:3.1mm 0;border-bottom:.3mm dashed #BFD3C8}
  .ix-n{flex:none;width:10mm;height:10mm;border-radius:3mm;background:#07503A;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:11pt}
  .ix-t{flex:1;font-size:12.5pt;font-weight:600;line-height:1.5}
  .ix-w{flex:none;width:16mm;text-align:center;font-size:10pt;color:#5B6F68}
  .ix-c{flex:none;width:24mm;text-align:center}
  .ix-c span{display:inline-block;background:#E8F4EE;color:#07503A;border-radius:99mm;padding:.6mm 3.5mm;font-size:9.5pt;font-weight:700}
  .ix-p{flex:none;width:14mm;text-align:center;font-family:var(--display);font-weight:800;font-size:13pt;color:#07503A}
  .ix-r.off .ix-n{background:#E3EAE6;color:#8A9A93}
  .ix-r.off .ix-t{color:#8A9A93;font-weight:500}
  .ix-r.off .ix-c span{background:none;color:#8A9A93;font-weight:500}
  .ix-r.off .ix-p{color:#B5C2BC}
  /* section opener */
  .dv{background:#07503A;color:#fff}
  .dv-top{position:relative;display:flex;justify-content:space-between;padding:15mm 16mm 0;font-size:10.5pt;color:#D9E8E1}
  .dv-main{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 16mm}
  .dv-num{font-family:var(--display);font-weight:800;font-size:170pt;line-height:.95;color:transparent;-webkit-text-stroke:1.1mm #C6F25A}
  .dv-main h2{font-family:var(--display);font-weight:800;font-size:32pt;line-height:1.5;margin:4mm 0 0;max-width:150mm}
  .dv-chips{display:flex;gap:4mm;margin-top:7mm;font-size:12pt;font-weight:600}
  .dv-chips span{border-radius:99mm;padding:1.4mm 6mm;border:.5mm solid #8FB0A6}

function qrImg(t){try{if(!t)return"";const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(t);q.make();const n=q.getModuleCount(),k=8,m=4,c=document.createElement("canvas");c.width=c.height=(n+m*2)*k;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";for(let r=0;r<n;r++)for(let i=0;i<n;i++)if(q.isDark(r,i))x.fillRect((i+m)*k,(r+m)*k,k,k);return `<img class="qr" src="${c.toDataURL("image/png")}" alt="">`}catch(e){return""}}
function logoData(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,420/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/png"))};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};im.src=u})}

/* ---------- storage ---------- */
let db=null,evs=[];const urls=new Map();
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open("shawahid",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("ev",{keyPath:"id"});
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function tx(mode,fn){return new Promise((res,rej)=>{const t=db.transaction("ev",mode);const q=fn(t.objectStore("ev"));
  t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function dbPut(o){if(!db)return true;try{const rec={id:o.id,el:o.el,cap:o.cap,ts:o.ts,demo:!!o.demo,type:o.blob.type||"image/jpeg",buf:await o.blob.arrayBuffer()};await tx("readwrite",s=>s.put(rec));return true}catch(e){toast("تعذر الحفظ، مساحة الجهاز ممتلئة");return false}}
async function dbDel(id){if(!db)return;try{await tx("readwrite",s=>s.delete(id))}catch(e){}}
function urlOf(e){if(!urls.has(e.id))urls.set(e.id,URL.createObjectURL(e.blob));return urls.get(e.id)}
function dropUrl(id){if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}}
const ofEl=id=>evs.filter(e=>e.el===id).sort((a,b)=>a.ts-b.ts);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- navigation (phone back button closes the top layer) ---------- */
const stack=[];let hist=true;
function push(closeFn){stack.push(closeFn);if(hist){try{history.pushState({d:stack.length},"")}catch(e){hist=false}}}
function back(n){n=n||1;if(hist&&history.state&&history.state.d){history.go(-n)}else{while(n-->0&&stack.length)stack.pop()()}}
window.addEventListener("popstate",e=>{const d=(e.state&&e.state.d)||0;while(stack.length>d)stack.pop()()});

/* ---------- helpers ---------- */
let toastT;
function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function hijri(ts){try{return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"}).format(new Date(ts))}catch(e){return new Date(ts).toLocaleDateString()}}
function blank(c){try{const t=document.createElement("canvas");t.width=t.height=8;const x=t.getContext("2d");x.drawImage(c,0,0,8,8);const d=x.getImageData(0,0,8,8).data;
  for(let i=4;i<d.length;i+=4){if(Math.abs(d[i]-d[0])>3||Math.abs(d[i+1]-d[1])>3||Math.abs(d[i+2]-d[2])>3)return false}return true}catch(e){return false}}
async function compress(file){
  const D=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight,im:im,u:u});im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};im.src=u});
  const k=Math.min(1,1600/Math.max(D.w,D.h));const w=Math.max(1,Math.round(D.w*k)),h=Math.max(1,Math.round(D.h*k));
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");let ok=false;
  const clear=()=>{x.fillStyle="#fff";x.fillRect(0,0,w,h)};
  if(window.createImageBitmap){try{clear();const bm=await createImageBitmap(file,{resizeWidth:w,resizeHeight:h,resizeQuality:"high"});x.drawImage(bm,0,0,w,h);if(bm.close)bm.close();ok=!blank(c)}catch(e){}}
  if(!ok){try{clear();x.drawImage(D.im,0,0,w,h);ok=!blank(c)}catch(e){}}
  URL.revokeObjectURL(D.u);
  if(ok){const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));if(b&&b.size>1500)return b}
  return file;
}
function demoBlob(title,color){return new Promise(r=>{const c=document.createElement("canvas");c.width=900;c.height=1200;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,900,1200);x.fillStyle=color;x.fillRect(0,0,900,150);x.fillStyle="#fff";x.font="bold 44px sans-serif";x.textAlign="center";
  try{x.direction="rtl"}catch(e){}x.fillText(title,450,95);x.fillStyle="#e1e8e4";for(let i=0;i<9;i++)x.fillRect(90+(i%3)*120,240+i*78,720-(i%3)*120,26);
  x.translate(450,1030);x.rotate(-.1);x.strokeStyle="#c2362b";x.lineWidth=6;x.strokeRect(-240,-62,480,124);x.fillStyle="#c2362b";x.font="bold 54px sans-serif";x.fillText("نموذج تجريبي",0,19);
  c.toBlob(r,"image/jpeg",.85)})}

$("#elview").addEventListener("click",e=>{
  const t=e.target.closest("[data-a],[data-view]");if(!t)return;
  if(t.dataset.view)return openViewer(t.dataset.view);
  const a=t.dataset.a;if(a==="back")back();else if(a==="rename")nameSheet(cur);else if(a==="printel"&&!t.disabled)printSheet(cur);

$("#elview").addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.cap){const v=evs.find(x=>x.id===t.dataset.cap);if(v){v.cap=t.value.trim();await dbPut(v)}return}
  if(t.type==="file"&&t.files&&t.files.length){
    const files=[...t.files];const el=cur;let ok=0;toast("جاري حفظ الشاهد");
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
    for(const f of files){try{const blob=await compress(f);const v={id:uid(),el:el,cap:"",ts:Date.now()+ok,blob:blob};if(await dbPut(v)){evs.push(v);ok++}}catch(_){}}
    t.value="";if(cur===el)renderEl();toast(ok?(ok===1?"تم حفظ الشاهد":"تم حفظ "+ok+" شواهد"):"تعذر قراءة الصورة، جرّب صورة أخرى");
  }

/* ---------- viewer ---------- */
function openViewer(id){const v=evs.find(x=>x.id===id);if(!v)return;
  const d=document.createElement("div");d.className="viewer";d.innerHTML=`
   <div class="viewer-top"><button class="icon-btn" data-a="close" aria-label="إغلاق">${svg(IC.x)}</button><button class="icon-btn" data-a="del" aria-label="حذف الشاهد">${svg(IC.trash)}</button></div>
   <div class="viewer-img"><img src="${urlOf(v)}" alt=""></div><div class="viewer-cap">${esc(v.cap||"بدون وصف")} · ${esc(hijri(v.ts))}<br><small id="v-info" style="opacity:.7">${Math.round(v.blob.size/1024)} ك.ب</small></div>`;
  $("#layer").appendChild(d);const depth=stack.length;
  const vi=d.querySelector(".viewer-img img"),inf=d.querySelector("#v-info");const base=inf.textContent;
  vi.onload=()=>{inf.textContent=base+" · "+vi.naturalWidth+"×"+vi.naturalHeight};vi.onerror=()=>{inf.textContent=base+" · تعذر عرض الصورة"};
  d.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;
    if(t.dataset.a==="close")back();
    else confirmSheet("حذف هذا الشاهد؟","لن تستطيع استرجاعه بعد الحذف.","حذف",async()=>{await dbDel(v.id);dropUrl(v.id);evs=evs.filter(x=>x.id!==v.id);back(stack.length-depth);setTimeout(()=>{if(cur!=null)renderEl();toast("تم حذف الشاهد")},60)})});
  push(()=>d.remove());
}

let sheetEl=null;
function openSheet(html,mount){
  if(!sheetEl){sheetEl=document.createElement("div");sheetEl.className="overlay";sheetEl.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"></div>`;

   <div class="row"><button class="btn btn-brand" id="n-save">حفظ</button>${el&&el.custom?`<button class="btn btn-danger" id="n-del">حذف العنصر</button>`:""}<button class="btn btn-line" id="n-x">إغلاق</button></div>`,s=>{
    s.querySelector("#n-x").onclick=()=>back();
    s.querySelector("#n-save").onclick=()=>{const v=s.querySelector("#n-t").value.trim();if(!v){toast("اكتب اسم العنصر");return}
      if(!el)S.custom.push({id:"c"+uid(),t:v});else if(el.custom)S.custom.find(c=>c.id===el.id).t=v;else S.titles[el.id]=v;
      if(el){const l=s.querySelector("#n-l").value.trim();if(l)S.links[el.id]=l;else delete S.links[el.id]}
      saveS();back();if(cur!=null)renderEl();else renderHome()};
    const del=s.querySelector("#n-del");
    if(del)del.onclick=()=>confirmSheet("حذف العنصر وكل شواهده؟","سيُحذف العنصر مع "+plural(ofEl(el.id).length)+".","حذف",async()=>{
      for(const v of ofEl(el.id)){await dbDel(v.id);dropUrl(v.id)}evs=evs.filter(x=>x.el!==el.id);S.custom=S.custom.filter(c=>c.id!==el.id);saveS();back(2)})})}

/* ---------- print ---------- */
function printSheet(elId){
  let scope=elId!=null?"one":"all";const el=elId!=null?elById(elId):null;
  openSheet(`<h3>طباعة ${el?"شواهد العنصر":"ملف الشواهد"}</h3>
   ${el?`<p>${esc(el.t)}: صفحة فاصلة للعنصر ثم شواهده.</p>`:`<p>المختصر: صفحة واحدة لكل عنصر فيها باركود يفتح شواهده. الكامل: كل الشواهد مطبوعة بصورها.</p>`}
   ${el?"":`<div class="field"><label>نوع الملف</label><div class="seg" id="p-mode"><button data-v="qr" aria-pressed="${S.mode==="qr"}">مختصر بالباركود</button><button data-v="full" aria-pressed="${S.mode!=="qr"}">كامل بالصور</button></div></div>`}
   <div class="field" id="p-perbox"><label>عدد الشواهد في الصفحة</label><div class="seg" id="p-per">
     ${[[1,"شاهد واحد"],[2,"شاهدان"],[4,"أربعة شواهد"]].map(o=>`<button data-v="${o[0]}" aria-pressed="${S.per===o[0]}">${o[1]}</button>`).join("")}</div></div>
   ${el?"":`<div class="field"><label for="p-link">رابط الباركود في الغلاف (اختياري)</label><input id="p-link" value="${esc(S.link)}" placeholder="الصق رابط مجلد شواهدك الإلكتروني" inputmode="url" dir="ltr" autocomplete="off"></div>`}
   ${framed?`<p>الطباعة تعمل عند فتح التطبيق من متصفح الجوال مباشرة، وليس من داخل هذه المعاينة.</p>`:`<p>من نافذة الطباعة تقدر تختار الطابعة أو الحفظ كملف PDF.</p>`}
   <div class="row"><button class="btn btn-brand" id="p-go">${svg(IC.print)}طباعة</button><button class="btn btn-line" id="p-x">إغلاق</button></div>`,s=>{
    s.querySelector("#p-per").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.per=+b.dataset.v;saveS();s.querySelectorAll("#p-per button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
    const pm=s.querySelector("#p-mode"),pb=s.querySelector("#p-perbox");const syn=()=>{if(pm)pb.hidden=S.mode==="qr"};syn();
    if(pm)pm.onclick=e=>{const b=e.target.closest("button");if(!b)return;S.mode=b.dataset.v;saveS();pm.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));syn()};
    s.querySelector("#p-x").onclick=()=>back();
    s.querySelector("#p-go").onclick=async()=>{const pl=s.querySelector("#p-link");if(pl){S.link=pl.value.trim();saveS()}
      toast("جاري تجهيز الصور للطباعة");await prepPrint();const n=buildPrint(scope==="one"?elId:null);if(!n){toast("لا توجد شواهد أو روابط للطباعة");return}
      await Promise.all([...document.querySelectorAll("#printRoot img")].map(i=>i.decode?i.decode().catch(()=>{}):0));
      try{window.print()}catch(e){toast("الطباعة غير متاحة في هذا العرض")}}})}
const LAT=(()=>{let d="";for(let x=-180;x<=390;x+=9.2){d+=`M${x.toFixed(1)} 0L${(x+171.5).toFixed(1)} 297M${x.toFixed(1)} 0L${(x-171.5).toFixed(1)} 297`}return `<svg class="lat" viewBox="0 0 210 297" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><path d="${d}" fill="none" stroke="#0E5D45" stroke-width=".4"/></svg>`})();
const PD=new Map();
async function prepPrint(){for(const v of evs){if(!PD.has(v.id)){try{PD.set(v.id,await b2d(v.blob))}catch(e){}}}}
const pSrc=v=>PD.get(v.id)||urlOf(v);
function buildPrint(onlyId){
  const els=allEls();const per=S.per||2;const full=onlyId==null;
  const qm=full&&S.mode==="qr";
  const targets=(onlyId!=null?els.filter(e=>e.id===onlyId):els).filter(e=>ofEl(e.id).length||(qm&&linkOf(e.id)));
  if(!targets.length){$("#printRoot").innerHTML="";return 0}
  let pn=full?5:1;const start={};
  for(const e of targets){start[e.id]=pn;pn+=qm?1:1+Math.ceil(ofEl(e.id).length/per)}
  const today=hijri(Date.now());
  const foot=n=>`<div class="pf"><span>${esc(S.school)}</span><b>${n}</b><span>ملف شواهد الأداء الوظيفي ${esc(S.year)}</span></div>`;
  const head=(tag,t)=>`<div class="ph">${LAT}<div class="ph-in"><span class="tag">${tag}</span><h2>${t}</h2><div class="who">${esc(S.name)}<br>${esc(S.subject)}</div></div></div>`;
  const page=(tag,t,body,n)=>`<section class="pp">${head(tag,t)}<div class="pb">${body}</div>${foot(n)}</section>`;
  const ring=(css)=>`<i class="ring" style="${css}"></i>`;
  let pages="",count=0,n=1;
  if(full){
    const qr=qrImg(S.link);
    pages+=`<section class="pp cv">${LAT}
      ${ring("width:190mm;height:190mm;left:-128mm;top:52mm;border:13mm solid #C6F25A")}
      ${ring("width:104mm;height:104mm;left:-85mm;top:95mm;border:5mm solid #397361")}
      ${ring("width:46mm;height:46mm;left:22mm;top:24mm;background:#185C48")}
      <div class="cv-top"><div class="cv-org">${S.logoR?`<span class="lg"><img src="${S.logoR}" alt=""></span>`:""}<div>المملكة العربية السعودية<br>وزارة التعليم<br>${esc(S.admin)}<br>${esc(S.school)}</div></div>${S.logoL?`<span class="lg"><img src="${S.logoL}" alt=""></span>`:`<div class="cv-year">${esc(S.year)}</div>`}</div>
      <div class="cv-main"><div class="cv-eye">العام الدراسي ${esc(S.year)}</div><h1>ملف شواهد<span>الأداء الوظيفي</span></h1><div class="cv-bar"></div>
        <p>توثيق أعمال المعلم وإنجازاته وفق عناصر تقييم الأداء الوظيفي لشاغلي الوظائف التعليمية.</p></div>
      <div class="cv-card"><div class="info">
        <div class="full"><div class="lb">إعداد المعلم</div><div class="cv-name">${esc(S.name)}</div></div>
        <div><div class="lb">المادة والصف</div><div class="vl">${esc(S.subject||"-")}</div></div>
        <div><div class="lb">مدير المدرسة</div><div class="vl">${esc(S.principal||"....................")}</div></div>
        </div>${qr?`<div class="qr-box">${qr}<span>امسح الباركود لفتح النسخة الإلكترونية</span></div>`:""}</div>
      <div class="cv-foot">${esc(today)}</div></section>`;
    const dc=(k,v,w)=>`<div class="dc${w?" w":""}"><div class="lb">${k}</div><div class="vl">${esc(v||"-")}</div></div>`;
    pages+=page("أ","بيانات المعلم",`
      <div class="stats3"><div class="st"><b>${evs.length}</b><span>إجمالي الشواهد</span></div><div class="st"><b>${targets.length}</b><span>عناصر موثقة</span></div><div class="st"><b>${els.length}</b><span>عناصر الأداء</span></div></div>
      <h3 class="sec">البيانات الأساسية</h3>
      <div class="cards">${dc("اسم المعلم",S.name,1)}${dc("المادة والصف",S.subject)}${dc("العام الدراسي",S.year)}${dc("المدرسة",S.school,1)}${dc("إدارة التعليم",S.admin,1)}${dc("مدير المدرسة",S.principal)}${dc("تاريخ إعداد الملف",today)}</div>`,2);
    pages+=page("ب","المقدمة",`<div class="bsm">بسم الله الرحمن الرحيم</div>
      <div class="txt">${esc(introText()).split(/\n+/).map(x=>`<p>${x}</p>`).join("")}</div>
      <div class="by">المعلم<b>${esc(S.name)}</b></div>`,3);
    if(qm)pages+=page("ج","فهرس الباركودات",`<div class="qgrid">${els.map((e,k)=>{const q=qrImg(linkOf(e.id));const c=ofEl(e.id).length;return `<div class="qc${q?"":" off"}"><span class="ix-n">${k+1}</span>${q||`<div class="qr none">بدون رابط</div>`}<b>${esc(e.t)}</b><small>${c?plural(c):"لا يوجد"}${start[e.id]?" · صفحة "+start[e.id]:""}</small></div>`}).join("")}</div>`,4);
    else pages+=page("ج","فهرس المحتويات",`<div><div class="ix-h"><span style="width:10mm">م</span><span style="flex:1">عنصر الأداء</span><span class="ix-w">الوزن</span><span class="ix-c">الشواهد</span><span class="ix-p" style="font:inherit;color:inherit">الصفحة</span></div>
      ${els.map((e,k)=>{const c=ofEl(e.id).length;return `<div class="ix-r${c?"":" off"}"><span class="ix-n">${k+1}</span><span class="ix-t">${esc(e.t)}</span><span class="ix-w">${e.w?e.w+"%":"-"}</span><span class="ix-c"><span>${c?plural(c):"لا يوجد"}</span></span><span class="ix-p">${start[e.id]||"-"}</span></div>`}).join("")}
      <div class="ix-r"><span class="ix-n" style="background:#C6F25A;color:#1C2B05">✓</span><span class="ix-t">الخاتمة والاعتماد</span><span class="ix-w"></span><span class="ix-c"></span><span class="ix-p">${pn}</span></div></div>`,4);
    n=5;
  }
  if(qm){for(const e of targets){const list=ofEl(e.id);const idx=els.findIndex(x=>x.id===e.id)+1;const qr=qrImg(linkOf(e.id));const th=list.slice(0,6);count+=Math.max(1,list.length);
    pages+=page(pad(idx),esc(e.t),`<div class="qe"><div class="qe-qr">${qr||`<div class="qr none">أضف رابط العنصر من زر الباركودات</div>`}<b>امسح الباركود</b><span>لعرض شواهد هذا العنصر كاملة</span></div>
      <div class="qe-info"><div class="qe-chips">${e.w?`<span>الوزن ${e.w}%</span>`:""}<span>${plural(list.length)}</span></div><h3 class="sec">قائمة الشواهد</h3>
      <ol>${list.slice(0,9).map((v,k)=>`<li><b>${k+1}</b>${esc(v.cap||"شاهد "+(k+1))}</li>`).join("")||"<li>الشواهد متاحة عبر الباركود</li>"}${list.length>9?`<li>وشواهد أخرى (${list.length-9})</li>`:""}</ol></div></div>
      ${th.length?`<h3 class="sec">نماذج من الشواهد</h3><div class="th t${th.length<=3?1:2}">${th.map(v=>`<img src="${pSrc(v)}" alt="">`).join("")}</div>`:""}`,n++)}}
  else for(const e of targets){const list=ofEl(e.id);const idx=els.findIndex(x=>x.id===e.id)+1;const np=Math.ceil(list.length/per);
    {const qr=qrImg(linkOf(e.id));const caps=list.slice(0,8);
      pages+=`<section class="pp dv">${LAT}
        ${ring("width:150mm;height:150mm;left:-70mm;top:-60mm;border:10mm solid #20624E")}
        ${ring("width:60mm;height:60mm;left:18mm;top:150mm;background:#1E633E")}
        <div class="dv-top"><span>ملف شواهد الأداء الوظيفي</span><span>${esc(S.name)}</span></div>
        <div class="dv-main"><div class="dv-num">${pad(idx)}</div><h2>${esc(e.t)}</h2>
          <div class="dv-chips">${e.w?`<span>الوزن ${e.w}%</span>`:""}<span>${plural(list.length)}</span><span>صفحة ${n+1}</span></div></div>
        <div class="dv-card"><div class="lst"><h3>شواهد هذا العنصر</h3><ol>${caps.map((v,k)=>`<li><b>${k+1}</b>${esc(v.cap||"شاهد "+(k+1))}</li>`).join("")}${list.length>8?`<li>وشواهد أخرى (${list.length-8})</li>`:""}</ol></div>
          ${qr?`<div class="qr-box">${qr}<span>امسح لفتح شواهد العنصر</span></div>`:""}</div>
        </section>`;n++}
    for(let p=0;p<np;p++){const chunk=list.slice(p*per,p*per+per);count+=chunk.length;
      pages+=page(pad(idx),esc(e.t),`<div class="pg g${per}">${chunk.map((v,k)=>`<figure class="fg"><span class="no">شاهد ${p*per+k+1}</span><img src="${pSrc(v)}" alt=""><figcaption><span>${esc(v.cap||"شاهد "+(p*per+k+1))}</span><small>${esc(hijri(v.ts))}</small></figcaption></figure>`).join("")}</div>`,n++)}}
  if(full){
    pages+=page("✓","الخاتمة والاعتماد",`
      <div class="txt"><p>تم بحمد الله إعداد ملف شواهد الأداء الوظيفي للعام الدراسي ${esc(S.year)}، ويضم ${evs.length} من الشواهد موزعة على ${targets.length} من عناصر الأداء.${qm?" الشواهد كاملة متاحة إلكترونيا عبر الباركود في صفحة كل عنصر.":""}</p><p>أقر بأن جميع الشواهد الواردة في هذا الملف صحيحة، وتمثل أعمالا نفذتها خلال العام الدراسي.</p></div>
      <h3 class="sec">الاعتماد</h3>
      <div class="signs"><div class="sg"><div class="lb">المعلم</div><div class="vl">${esc(S.name)}</div><div class="ln"></div><div class="lb">التوقيع</div></div>
        <div class="sg"><div class="lb">مدير المدرسة</div><div class="vl">${esc(S.principal||"....................")}</div><div class="ln"></div><div class="lb">التوقيع</div></div></div>
      <div class="stamp">الختم</div>`,n);
  }
  $("#printRoot").innerHTML=pages;return count;
}

/* ---------- backup ---------- */
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function d2b(d){const p=d.split(",");const bin=atob(p[1]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);const m=/^data:([^;,]+)/.exec(p[0]);return new Blob([a],{type:m?m[1]:"image/jpeg"})}
function backupSheet(){
  openSheet(`<h3>النسخة الاحتياطية</h3><p>الشواهد محفوظة على هذا الجوال فقط ولا تُرفع لأي مكان. احفظ نسخة كل فترة حتى لا تضيع إذا تغيّر الجوال أو مُسحت بيانات المتصفح.</p>
   ${framed?`<p>حفظ النسخة يعمل عند فتح التطبيق من متصفح الجوال مباشرة.</p>`:""}
   <button class="btn btn-brand btn-block" id="b-out">${svg(IC.save)}حفظ نسخة احتياطية</button>
   <label class="btn btn-line btn-block" for="b-in" style="cursor:pointer">استرجاع من نسخة محفوظة</label><input id="b-in" type="file" accept="application/json,.json" hidden>
   <button class="btn btn-line btn-block" id="b-x">إغلاق</button>`,s=>{
    s.querySelector("#b-x").onclick=()=>back();
    s.querySelector("#b-out").onclick=async()=>{const real=evs.filter(e=>!e.demo);const out={app:"shawahid",v:1,s:S,evs:[]};
      for(const e of real)out.evs.push({id:e.id,el:e.el,cap:e.cap,ts:e.ts,data:await b2d(e.blob)});
      try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:"application/json"}));a.download="shawahid-backup.json";document.body.appendChild(a);a.click();a.remove();toast("تم تجهيز النسخة ("+real.length+")")}catch(e){toast("تعذر حفظ النسخة في هذا العرض")}};
    s.querySelector("#b-in").onchange=async e=>{const f=e.target.files[0];if(!f)return;
      try{const o=JSON.parse(await f.text());if(o.app!=="shawahid"||!Array.isArray(o.evs))throw 0;let n=0;
        for(const x of o.evs){if(evs.some(v=>v.id===x.id))continue;const v={id:x.id,el:x.el,cap:x.cap||"",ts:x.ts,blob:d2b(x.data)};if(await dbPut(v)){evs.push(v);n++}}
        if(o.s){S=Object.assign({},DEF,o.s,{seeded:true});saveS()}back();renderHome();toast("تم استرجاع "+n+" من الشواهد")}
      catch(_){toast("الملف غير صالح. اختر ملف النسخة الاحتياطية الصحيح")}}})}

/* ---------- start ---------- */
(async function(){
  renderHome();
  db=await idbOpen();
  if(db){try{evs=((await tx("readonly",s=>s.getAll()))||[]).map(r=>r.buf?{id:r.id,el:r.el,cap:r.cap,ts:r.ts,demo:r.demo,blob:new Blob([r.buf],{type:r.type||"image/jpeg"})}:r)}catch(e){db=null}}
  if(!S.seeded&&!evs.length){
    const d=[[1,"سجل الإشراف اليومي","#0A6B4D"],[4,"تقرير استراتيجية التعلم باللعب","#0E7C86"],[7,"درس تفاعلي على منصة مدرستي","#5B4BB7"]];
    for(let k=0;k<d.length;k++){const v={id:"demo"+k,el:d[k][0],cap:d[k][1],ts:Date.now()+k,blob:await demoBlob(d[k][1],d[k][2]),demo:true};await dbPut(v);evs.push(v)}
    S.seeded=true;saveS();
  }
  renderHome();
})();
</script>
